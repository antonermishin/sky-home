<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Небо</title>
<style>html,body{margin:0;height:100%;background:#05060c;color:rgba(245,245,247,.4);font:300 28px system-ui,sans-serif;display:flex;align-items:center;justify-content:center}</style>
</head><body>Небо
<script>
(function () {
  var REPO = "antonermishin/sky-home", done = false;
  function go(sha) {
    if (done) return; done = true;
    var name = "gh/" + REPO + (sha ? "@" + sha : "");
    location.replace("/module/" + encodeURIComponent(name) + "/app/main.html");
  }
  var last = null; try { last = localStorage.getItem("skySha"); } catch (e) {}
  setTimeout(function () { go(last); }, 5000); // GitHub unreachable: open the last known version
  fetch("https://api.github.com/repos/" + REPO + "/commits/main", { headers: { Accept: "application/vnd.github.sha" } })
    .then(function (r) { if (!r.ok) throw r.status; return r.text(); })
    .then(function (sha) { sha = sha.trim(); if (!/^[0-9a-f]{40}$/.test(sha)) throw 0; try { localStorage.setItem("skySha", sha); } catch (e) {} go(sha); })
    .catch(function () { go(last); });
})();
</script></body></html>
